services:
  web:
    image: node:24
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    command: sh -c "corepack enable && corepack prepare pnpm@11.9.0 --activate && pnpm install --no-frozen-lockfile && pnpm exec vite --host 0.0.0.0 --port 5173"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
